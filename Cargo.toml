[package]
name = "functional-kube"
version = "0.1.0"
edition = "2024"
description = "A framework for building Kubernetes controllers using the Functional Core, Imperative Shell pattern"

[dependencies]
async-trait = "0.1"
jiff = "0.2"
kube = { version = "2.0", default-features = false, features = [
  "runtime",
  "derive",
  "client",
  "rustls-tls",
  "aws-lc-rs",
] }
k8s-openapi = { version = "0.26", features = ["latest", "schemars"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["attributes"] }
